[project]
name = "soragl"
version = "0.1.0"
description = "A 2D/3D Python game engine built on pygame-ce and moderngl."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Box2D>=2.3.10",
    "moderngl>=5.12",
    "numpy>=2.0",
    "pygame-ce>=2.5",
    "PyGLM>=2.8",
    "PyOpenGL>=3.1",
]

[project.optional-dependencies]
# Steam multiplayer (soragl.net.steam): py_steam_net release wheels (not on PyPI;
# no Linux wheel: build it with maturin there). Needs Valve's libsteam_api installed
# next to it: python -m soragl.net.steam install <path>.
steam = [
    "py_steam_net @ https://github.com/HeatXD/py_steam_net/releases/download/v20250625065149-17457a4/py_steam_net-0.1.0-cp311-cp311-macosx_11_0_arm64.whl ; python_version == '3.11' and sys_platform == 'darwin' and platform_machine == 'arm64'",
    "py_steam_net @ https://github.com/HeatXD/py_steam_net/releases/download/v20250625065149-17457a4/py_steam_net-0.1.0-cp311-cp311-macosx_10_12_x86_64.whl ; python_version == '3.11' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "py_steam_net @ https://github.com/HeatXD/py_steam_net/releases/download/v20250625065149-17457a4/py_steam_net-0.1.0-cp311-cp311-win_amd64.whl ; python_version == '3.11' and sys_platform == 'win32' and platform_machine == 'AMD64'",
    "py_steam_net @ https://github.com/HeatXD/py_steam_net/releases/download/v20250625065149-17457a4/py_steam_net-0.1.0-cp312-cp312-macosx_11_0_arm64.whl ; python_version == '3.12' and sys_platform == 'darwin' and platform_machine == 'arm64'",
    "py_steam_net @ https://github.com/HeatXD/py_steam_net/releases/download/v20250625065149-17457a4/py_steam_net-0.1.0-cp312-cp312-macosx_10_12_x86_64.whl ; python_version == '3.12' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "py_steam_net @ https://github.com/HeatXD/py_steam_net/releases/download/v20250625065149-17457a4/py_steam_net-0.1.0-cp312-cp312-win_amd64.whl ; python_version == '3.12' and sys_platform == 'win32' and platform_machine == 'AMD64'",
    "py_steam_net @ https://github.com/HeatXD/py_steam_net/releases/download/v20250625065149-17457a4/py_steam_net-0.1.0-cp313-cp313-macosx_11_0_arm64.whl ; python_version == '3.13' and sys_platform == 'darwin' and platform_machine == 'arm64'",
    "py_steam_net @ https://github.com/HeatXD/py_steam_net/releases/download/v20250625065149-17457a4/py_steam_net-0.1.0-cp313-cp313-macosx_10_12_x86_64.whl ; python_version == '3.13' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "py_steam_net @ https://github.com/HeatXD/py_steam_net/releases/download/v20250625065149-17457a4/py_steam_net-0.1.0-cp313-cp313-win_amd64.whl ; python_version == '3.13' and sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv.build-backend]
module-name = "soragl"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Box2D's SWIG bindings warn on import; nothing we can act on
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff]
src = ["src", "tests", "examples"]

[tool.ruff.lint]
# PLW1514: text files opened without encoding= read as cp1252 on Windows
select = ["E", "F", "N", "W", "PLW1514"]
preview = true
explicit-preview-rules = true
# line length is the formatter's job
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# init/run/stop are exported lazily through __getattr__ (keeps OpenGL out of import)
"src/soragl/__init__.py" = ["F822"]
